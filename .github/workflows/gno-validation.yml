name: Gno validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Teshio
        uses: actions/checkout@v4

      - name: Check out Gno toolchain source
        uses: actions/checkout@v4
        with:
          repository: gnolang/gno
          path: gno-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: gno-src/go.sum

      - name: Build and install Gno tools from source
        working-directory: gno-src
        run: |
          make install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify Gno toolchain
        run: |
          gno version
          command -v gno

      - name: Format check
        working-directory: contract/r/teshio
        shell: bash
        run: |
          gno fmt ./...
          git diff --exit-code -- '*.gno'

      - name: Lint
        working-directory: contract/r/teshio
        run: gno lint ./...

      - name: Run package tests
        working-directory: contract/r/teshio
        run: gno test ./...

name: Gno validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Teshio
        uses: actions/checkout@v4

      - name: Install official Gno toolchain
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/gnolang/gno/master/misc/install.sh | sh
          echo "$HOME/.gno/bin" >> "$GITHUB_PATH"
          gno version

      - name: Format check
        working-directory: contract/r/teshio
        shell: bash
        run: |
          gno fmt ./...
          git diff --exit-code -- '*.gno'

      - name: Lint
        working-directory: contract/r/teshio
        run: gno lint ./...

      - name: Compile and run package tests
        working-directory: contract/r/teshio
        run: gno test ./... -v
